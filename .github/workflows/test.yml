name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Thin caller: the whole matrix lives in cpp-gates.yml (workflow_call) so
  # the estate can adopt it verbatim. Triggers and concurrency stay here —
  # a called workflow cannot own them.
  gates:
    name: "C++ gates (shared matrix)"
    uses: ./.github/workflows/cpp-gates.yml
