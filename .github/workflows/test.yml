name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Thin caller: the whole matrix lives in the estate-shared cpp-kit. The
  # local cpp-gates.yml is deleted — the contract job travels with the kit,
  # so the interface check still runs on every push.
  gates:
    name: "C++ gates (shared matrix)"
    uses: WyattAu/engineering-standards/.github/workflows/cpp-kit.yml@main
    with:
      tier: full
