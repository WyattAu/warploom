name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: true
        type: string

# The old workflow drove OmniCppController.py with pre-module CLI shapes
# ("build all \"Clean Build Pipeline\" default release --compiler gcc"). Every
# one of those invocations failed: the positional arguments no longer parse,
# and the project it configured was src/game with C++20, which stopped
# existing in S5. Release now goes through CMake presets directly, which is
# the same path CI verifies.

jobs:
  package:
    name: "Build release artifacts"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain + Vulkan + shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang python3 \
            libvulkan-dev glslang-tools mesa-vulkan-drivers \
            libx11-dev libxcb1-dev pkg-config

      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: ~/.cache/warploom/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'cmake/FindDependencies.cmake') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing $v"

      - name: Configure
        run: |
          cmake --preset default \
            -DCMAKE_BUILD_TYPE=Release \
            -DWARPLOOM_VERSION=${{ steps.ver.outputs.version }}

      - name: Build (modules, tests, shaders, viewport)
        run: cmake --build build/default -j$(nproc)

      - name: Test
        run: ctest --test-dir build/default --output-on-failure --timeout 600

      - name: Live protocol proofs
        run: |
          build/default/bin/warploom_headless_host /tmp/proof_a.sock 2>/tmp/proof_a.log &
          build/default/bin/warploom_headless_host /tmp/proof_b.sock 2>/tmp/proof_b.log &
          for i in $(seq 1 50); do
            [ -S /tmp/proof_a.sock ] && [ -S /tmp/proof_b.sock ] && break
            sleep 0.2
          done
          python3 tools/live_proof.py all \
            --sock /tmp/proof_a.sock --sock-a /tmp/proof_a.sock --sock-b /tmp/proof_b.sock

      - name: Package
        run: cpack --config build/default/CPackConfig.cmake -G TGZ

      - name: Verify the package is not empty
        run: |
          set -e
          f=$(ls build/default/*.tar.gz)
          echo "artifact: $f"
          tar tzf "$f" > /tmp/manifest.txt
          wc -l < /tmp/manifest.txt
          for required in \
            bin/warploom_viewport \
            share/shaders/pbr_scene.frag.spv \
            lib/libwarploom_core.so \
            lib/cmake/WarploomCore/WarploomCoreConfig.cmake
          do
            grep -q "$required" /tmp/manifest.txt \
              || { echo "MISSING from package: $required"; exit 1; }
            echo "  ok: $required"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/default/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}