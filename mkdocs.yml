site_name: Warploom
site_description: >-
  Warploom: a data-oriented C++ engine with deterministic simulation,
  Vulkan rendering, and a time-warp editor.
site_author: Warploom contributors

repo_url: https://github.com/WyattAu/OmniCPP-template
repo_name: OmniCPP-template

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - git-committers:
      repository: WyattAu/OmniCPP-template
      branch: main

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: your-org
      repo: your-repo
  - pymdownx.progressbar
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.striphtml
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - def_list
  - abbr
  - admonition

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: guides/quick_start.md
  - Capability and Status:
      - Rendering status (engine vs app vs proof): rendering-status.md
      - Roadmap: roadmap.md
      - Replay format: replay-format.md
      - GPU-driven rendering: gpu-driven-rendering.md
      - Scale benchmark: scale-benchmark.md
  - Architecture:
      - Developer guide: developer-guide.md
      - API documentation: api-documentation.md
      - Modules and rename: rename-and-modules.md
      - Module extraction plans:
          - warploom-core-plan.md
          - warploom-render-plan.md
          - warploom-asset-plan.md
          - warploom-editor-plan.md
          - warploom-engine-plan.md
          - warploom-identity-plan.md
          - warploom-timeline-plan.md
          - warploom-clip-timeline-view-plan.md
  - Guides:
      - Game engine: user-guide-game-engine.md
      - Build system: user-guide-build-system.md
      - Vulkan rendering: vulkan-rendering.md
      - Nix development: nix-development.md
      - WASM builds: wasm-builds.md
      - Migration guide: migration-guide.md
  - Platform Builds:
      - Linux: linux-builds.md
      - MSVC: msvc-builds.md
      - MinGW: mingw-builds.md
      - CachyOS: cachyos-builds.md
      - VS Code on Linux: vscode-linux-setup.md
  - Troubleshooting:
      - Overview: troubleshooting.md
      - Guide: troubleshooting-guide.md
      - Linux: linux-troubleshooting.md
      - llvmpipe viewport JIT issue: llvmpipe-viewport-jit-issue.md
      - Compiler detection: compiler-detection.md
  - FAQ:
      - index.md
      - Build questions: faq/build-questions.md
      - Common questions: faq/common-questions.md
      - Performance: faq/performance-questions.md
  - API:
      - Overview: api/overview.md
  - About:
      - License: about/license.md
